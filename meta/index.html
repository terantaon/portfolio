<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta</title>
</head>
<body>
    <h1>Meta</h1>
    <div id="slider">
        <label>
            Show commits until:
            <input type="range" id="commit-progress" min="0" max="100" value="100"/>
            <time id="commit-time"></time>
        </label>
    </div>
    <div id="stats"></div>
    <div id="scrolly-1">
        <div id="scatter-story"></div>
        <div id="scatter-plot">
            <h2>Commits by time of day</h2>
            <div id="chart"></div>
            <dl id="language-breakdown" class="stats"></dl>
            <dl id="commit-tooltip" class="info tooltip" hidden>
                <dt>Commit</dt>
                <dd>
                    <a href="" id="commit-link" target="_blank"></a>
                </dd>
                <dt>Date</dt>
                <dd id="commit-date"></dd>
            </dl>
        </div>
    </div>

    <p id="selection-count">No commits selected</p>

    <dl id="files"></dl>

    <script src="../global.js" type="module"></script>
    <script src="main.js" type="module"></script>
</body>
</html>
